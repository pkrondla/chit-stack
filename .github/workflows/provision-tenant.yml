name: Provision Tenant

on:
  workflow_dispatch:
    inputs:
      tenantKey:
        required: true
        type: string
      environment:
        required: true
        default: prod
        type: choice
        options:
          - prod
          - uat
          - dev
          - qa
      profile:
        required: true
        default: nonprod-ultra-low
        type: choice
        options:
          - nonprod-ultra-low
          - prod-min-safe
      staticWebSkuOverride:
        required: false
        default: ""
      apiPlanSkuOverride:
        required: false
        default: ""
      sqlSkuOverride:
        required: false
        default: ""
      fixedTenantId:
        description: TenantId used by the tenant API in stamp mode (must match dbo.Tenants row)
        required: false
        default: "1"
        type: string
      registerInGlobal:
        description: Upsert tenant row in Global dbo.Tenants after deploy
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      tenantKey:
        required: true
        type: string
      environment:
        required: true
        type: string
      profile:
        required: true
        type: string
      staticWebSkuOverride:
        required: false
        type: string
        default: ""
      apiPlanSkuOverride:
        required: false
        type: string
        default: ""
      sqlSkuOverride:
        required: false
        type: string
        default: ""
      fixedTenantId:
        required: false
        type: string
        default: "1"
      registerInGlobal:
        required: false
        type: boolean
        default: true
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      SQL_ADMIN_LOGIN:
        required: true
      SQL_ADMIN_PASSWORD:
        required: true

jobs:
  resolve-profile:
    runs-on: ubuntu-latest
    outputs:
      staticWebSku: ${{ steps.resolve.outputs.staticWebSku }}
      apiPlanSku: ${{ steps.resolve.outputs.apiPlanSku }}
      sqlSku: ${{ steps.resolve.outputs.sqlSku }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve profile and overrides
        id: resolve
        shell: pwsh
        run: |
          $config = Get-Content -Raw deployment/tenants.json | ConvertFrom-Json
          $profileName = "${{ inputs.profile }}"
          $profile = $config.profiles.PSObject.Properties[$profileName].Value
          if (-not $profile) { throw "Profile '$profileName' not found." }
          $staticWebSku = if ("${{ inputs.staticWebSkuOverride }}") { "${{ inputs.staticWebSkuOverride }}" } else { $profile.staticWebSku }
          $apiPlanSku = if ("${{ inputs.apiPlanSkuOverride }}") { "${{ inputs.apiPlanSkuOverride }}" } else { $profile.apiPlanSku }
          $sqlSku = if ("${{ inputs.sqlSkuOverride }}") { "${{ inputs.sqlSkuOverride }}" } else { $profile.sqlSku }
          "staticWebSku=$staticWebSku" >> $env:GITHUB_OUTPUT
          "apiPlanSku=$apiPlanSku" >> $env:GITHUB_OUTPUT
          "sqlSku=$sqlSku" >> $env:GITHUB_OUTPUT

  deploy:
    needs: resolve-profile
    uses: ./.github/workflows/deploy-tenant.yml
    with:
      environment: ${{ inputs.environment }}
      tenantKey: ${{ inputs.tenantKey }}
      staticWebSku: ${{ needs.resolve-profile.outputs.staticWebSku }}
      apiPlanSku: ${{ needs.resolve-profile.outputs.apiPlanSku }}
      sqlSku: ${{ needs.resolve-profile.outputs.sqlSku }}
      fixedTenantId: ${{ inputs.fixedTenantId }}
    secrets: inherit

  register-global-tenant:
    needs: deploy
    if: ${{ inputs.registerInGlobal }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Install sqlcmd
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y curl gnupg2 apt-transport-https ca-certificates
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" | sudo tee /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"
      - name: Register tenant in Global database
        shell: pwsh
        run: |
          ./deployment/scripts/register-global-tenant.ps1 `
            -Environment "${{ inputs.environment }}" `
            -TenantKey "${{ inputs.tenantKey }}" `
            -SqlLogin "${{ secrets.SQL_ADMIN_LOGIN }}" `
            -SqlPassword "${{ secrets.SQL_ADMIN_PASSWORD }}"
