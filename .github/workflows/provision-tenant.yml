name: CD - Provision Tenant

on:
  workflow_dispatch:
    inputs:
      tenantKey:
        description: Tenant key from chitstack.azure/deployment/tenants.json
        required: true
        type: string
      environment:
        required: true
        default: prod
        type: choice
        options:
          - prod
          - uat
          - dev
          - qa
      confirm:
        description: Type DEPLOY to create/update Azure infrastructure
        required: true
        type: string
  workflow_call:
    inputs:
      tenantKey:
        required: true
        type: string
      environment:
        required: true
        type: string
      confirm:
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      SQL_ADMIN_LOGIN:
        required: true
      SQL_ADMIN_PASSWORD:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  resolve-profile:
    runs-on: ubuntu-latest
    outputs:
      staticWebSku: ${{ steps.resolve.outputs.staticWebSku }}
      apiPlanSku: ${{ steps.resolve.outputs.apiPlanSku }}
      sqlSku: ${{ steps.resolve.outputs.sqlSku }}
      fixedTenantId: ${{ steps.resolve.outputs.fixedTenantId }}
      azureResourcePrefix: ${{ steps.resolve.outputs.azureResourcePrefix }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve tenant settings from tenants.json
        id: resolve
        shell: pwsh
        run: |
          $config = Get-Content -Raw chitstack.azure/deployment/tenants.json | ConvertFrom-Json
          $tenant = $config.tenants | Where-Object { $_.tenantKey -eq "${{ inputs.tenantKey }}" } | Select-Object -First 1
          if (-not $tenant) { throw "Tenant '${{ inputs.tenantKey }}' not found in chitstack.azure/deployment/tenants.json." }
          if ($tenant.enabled -ne $true) { throw "Tenant '${{ inputs.tenantKey }}' is disabled in tenants.json." }
          $tenantEnv = $tenant.environments.PSObject.Properties["${{ inputs.environment }}"].Value
          if (-not $tenantEnv -or $tenantEnv.enabled -ne $true) { throw "Tenant '${{ inputs.tenantKey }}' is not enabled for environment '${{ inputs.environment }}'." }
          if (-not ($tenant.PSObject.Properties.Name -contains 'tenantId') -or -not ($tenant.tenantId -as [int]) -or [int]$tenant.tenantId -le 0) {
            throw "Tenant '${{ inputs.tenantKey }}' must define a positive integer tenantId in tenants.json."
          }
          $profileName = [string]$tenant.profile
          $profile = $config.profiles.PSObject.Properties[$profileName].Value
          if (-not $profile) { throw "Profile '$profileName' not found." }
          $tenantOverrides = if (($tenant.PSObject.Properties.Name -contains 'overrides') -and $tenant.overrides) { $tenant.overrides } else { $null }
          $staticWebSku = if ($tenantOverrides -and $tenantOverrides.staticWebSku) { [string]$tenantOverrides.staticWebSku } else { [string]$profile.staticWebSku }
          $apiPlanSku = if ($tenantOverrides -and $tenantOverrides.apiPlanSku) { [string]$tenantOverrides.apiPlanSku } else { [string]$profile.apiPlanSku }
          $sqlSku = if ($tenantOverrides -and $tenantOverrides.sqlSku) { [string]$tenantOverrides.sqlSku } else { [string]$profile.sqlSku }
          $fixedTenantId = [int]$tenant.tenantId
          $prefix = if ($config.defaults -and $config.defaults.azureResourcePrefix) { [string]$config.defaults.azureResourcePrefix } else { "chitstack" }
          if ([string]::IsNullOrWhiteSpace($prefix)) { throw "defaults.azureResourcePrefix must be set in tenants.json." }
          if ($prefix -notmatch '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$') { throw "defaults.azureResourcePrefix must be lowercase alphanumeric with hyphens (got: '$prefix')." }
          "staticWebSku=$staticWebSku" >> $env:GITHUB_OUTPUT
          "apiPlanSku=$apiPlanSku" >> $env:GITHUB_OUTPUT
          "sqlSku=$sqlSku" >> $env:GITHUB_OUTPUT
          "fixedTenantId=$fixedTenantId" >> $env:GITHUB_OUTPUT
          "azureResourcePrefix=$prefix" >> $env:GITHUB_OUTPUT

  build:
    needs: resolve-profile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Restore and publish Tenant API
        shell: pwsh
        run: |
          dotnet restore chitstack.tenant/chitstack.tenant.api/ChitStack.API.csproj
          dotnet publish chitstack.tenant/chitstack.tenant.api/ChitStack.API.csproj -c Release -o artifacts/tenant-api
      - name: Build Tenant DACPAC
        shell: pwsh
        run: dotnet build chitstack.tenant/chitstack.tenant.database/ChitStack.Database.Tenant.sqlproj -c Release
      - name: Build Tenant web
        shell: pwsh
        env:
          VITE_API_URL: https://api-${{ needs.resolve-profile.outputs.azureResourcePrefix }}-${{ inputs.environment }}-${{ inputs.tenantKey }}.azurewebsites.net/api
        run: |
          Push-Location chitstack.tenant/chitstack.tenant.web
          npm ci
          npm run build
          Pop-Location
      - name: Upload Tenant API artifact
        uses: actions/upload-artifact@v5
        with:
          name: tenant-api-package
          path: artifacts/tenant-api
          retention-days: 1
      - name: Upload Tenant web artifact
        uses: actions/upload-artifact@v5
        with:
          name: tenant-web-dist
          path: chitstack.tenant/chitstack.tenant.web/dist
          retention-days: 1
      - name: Upload Tenant DACPAC artifact
        uses: actions/upload-artifact@v5
        with:
          name: tenant-dacpac
          path: chitstack.tenant/chitstack.tenant.database/bin/Release/*.dacpac
          retention-days: 1

  deploy-infra:
    needs: resolve-profile
    uses: ./.github/workflows/deploy-infra.yml
    with:
      confirm: ${{ inputs.confirm }}
      scope: tenant
      environment: ${{ inputs.environment }}
      tenantKey: ${{ inputs.tenantKey }}
      staticWebSku: ${{ needs.resolve-profile.outputs.staticWebSku }}
      apiPlanSku: ${{ needs.resolve-profile.outputs.apiPlanSku }}
      sqlSku: ${{ needs.resolve-profile.outputs.sqlSku }}
      resourcePrefix: ${{ needs.resolve-profile.outputs.azureResourcePrefix }}
      resourceGroup: rg-${{ needs.resolve-profile.outputs.azureResourcePrefix }}-${{ inputs.environment }}-${{ inputs.tenantKey }}
    secrets: inherit

  deploy-db-api-web:
    runs-on: ubuntu-latest
    needs:
      - resolve-profile
      - build
      - deploy-infra
    environment: ${{ inputs.environment }}
    env:
      PREFIX: ${{ needs.resolve-profile.outputs.azureResourcePrefix }}
      ENV_NAME: ${{ inputs.environment }}
      TENANT_KEY: ${{ inputs.tenantKey }}
    steps:
      - uses: actions/checkout@v5
      - name: Download Tenant API artifact
        uses: actions/download-artifact@v5
        with:
          name: tenant-api-package
          path: artifacts/tenant-api
      - name: Download Tenant web artifact
        uses: actions/download-artifact@v5
        with:
          name: tenant-web-dist
          path: artifacts/tenant-web
      - name: Download Tenant DACPAC artifact
        uses: actions/download-artifact@v5
        with:
          name: tenant-dacpac
          path: artifacts/tenant-dacpac
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Open temporary SQL firewall for GitHub runner
        id: sqlfw
        shell: bash
        env:
          RG: rg-${{ env.PREFIX }}-${{ env.ENV_NAME }}-${{ env.TENANT_KEY }}
          SQL_SERVER: sql-${{ env.PREFIX }}-${{ env.ENV_NAME }}-${{ env.TENANT_KEY }}
        run: |
          set -e
          RUNNER_IP=$(curl -4sSf https://ipv4.icanhazip.com)
          echo "Runner egress IPv4: $RUNNER_IP"
          RULE="gh-${{ github.run_id }}-${{ github.run_attempt }}"
          az sql server firewall-rule create \
            --resource-group "$RG" \
            --server "$SQL_SERVER" \
            --name "$RULE" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP"
          echo "rule=$RULE" >> "$GITHUB_OUTPUT"
      - name: Install SqlPackage
        shell: bash
        run: dotnet tool update --global microsoft.sqlpackage
      - name: Generate Tenant DB deploy report
        shell: bash
        env:
          FIXED_TENANT_ID: ${{ needs.resolve-profile.outputs.fixedTenantId }}
        run: |
          ~/.dotnet/tools/sqlpackage \
            /Action:DeployReport \
            /SourceFile:artifacts/tenant-dacpac/ChitStack.Database.Tenant.dacpac \
            /TargetServerName:sql-${{ env.PREFIX }}-${{ env.ENV_NAME }}-${{ env.TENANT_KEY }}.database.windows.net \
            /TargetDatabaseName:sqldb-${{ env.PREFIX }}-${{ env.ENV_NAME }}-${{ env.TENANT_KEY }} \
            /TargetUser:${{ secrets.SQL_ADMIN_LOGIN }} \
            /TargetPassword:${{ secrets.SQL_ADMIN_PASSWORD }} \
            /v:TenantId="$FIXED_TENANT_ID" \
            /OutputPath:tenant-${{ env.TENANT_KEY }}-deploy-report.xml
      - name: Publish Tenant DACPAC
        shell: bash
        env:
          FIXED_TENANT_ID: ${{ needs.resolve-profile.outputs.fixedTenantId }}
        run: |
          ~/.dotnet/tools/sqlpackage \
            /Action:Publish \
            /SourceFile:artifacts/tenant-dacpac/ChitStack.Database.Tenant.dacpac \
            /TargetServerName:sql-${{ env.PREFIX }}-${{ env.ENV_NAME }}-${{ env.TENANT_KEY }}.database.windows.net \
            /TargetDatabaseName:sqldb-${{ env.PREFIX }}-${{ env.ENV_NAME }}-${{ env.TENANT_KEY }} \
            /TargetUser:${{ secrets.SQL_ADMIN_LOGIN }} \
            /TargetPassword:${{ secrets.SQL_ADMIN_PASSWORD }} \
            /v:TenantId="$FIXED_TENANT_ID" \
            /p:BlockOnPossibleDataLoss=true
      - name: Deploy Tenant API
        uses: azure/webapps-deploy@v3
        with:
          app-name: api-${{ env.PREFIX }}-${{ env.ENV_NAME }}-${{ env.TENANT_KEY }}
          package: artifacts/tenant-api
      - name: Resolve App Insights connection string
        id: ai
        shell: bash
        env:
          RG: rg-${{ env.PREFIX }}-${{ env.ENV_NAME }}-${{ env.TENANT_KEY }}
        run: |
          set +e
          AI=$(az monitor app-insights component show -g "$RG" --app "ai-${{ env.PREFIX }}-${{ env.ENV_NAME }}-${{ env.TENANT_KEY }}" --query connectionString -o tsv)
          {
            echo "connection<<AIEOF"
            echo "$AI"
            echo "AIEOF"
          } >> "$GITHUB_OUTPUT"
      - name: Configure Tenant API app settings
        shell: pwsh
        env:
          RG: rg-${{ env.PREFIX }}-${{ env.ENV_NAME }}-${{ env.TENANT_KEY }}
          FIXED_TENANT_ID: ${{ needs.resolve-profile.outputs.fixedTenantId }}
        run: |
          $ai = "${{ steps.ai.outputs.connection }}"
          $params = @{
            Scope = "tenant"
            Environment = "${{ env.ENV_NAME }}"
            TenantKey = "${{ env.TENANT_KEY }}"
            ResourceGroup = $env:RG
            SqlLogin = "${{ secrets.SQL_ADMIN_LOGIN }}"
            SqlPassword = "${{ secrets.SQL_ADMIN_PASSWORD }}"
            ResourcePrefix = "${{ env.PREFIX }}"
            AppInsightsConnectionString = $ai
          }
          if (-not [string]::IsNullOrWhiteSpace($env:FIXED_TENANT_ID)) {
            $params.FixedTenantId = [int]$env:FIXED_TENANT_ID
          }
          ./chitstack.azure/deployment/scripts/configure-stamp-app.ps1 @params
      - name: Deploy Tenant Web
        shell: bash
        env:
          RG: rg-${{ env.PREFIX }}-${{ env.ENV_NAME }}-${{ env.TENANT_KEY }}
          SWA_NAME: web-${{ env.PREFIX }}-${{ env.ENV_NAME }}-${{ env.TENANT_KEY }}
        run: |
          set -e
          TOKEN=$(az staticwebapp secrets list --resource-group "$RG" --name "$SWA_NAME" --query "properties.apiKey" -o tsv)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Could not read Static Web Apps deployment token (check name/RG and RBAC)."
            exit 1
          fi
          npx --yes @azure/static-web-apps-cli@2.0.8 deploy artifacts/tenant-web \
            --deployment-token "$TOKEN" \
            --env production
      - name: Upload DB deploy report
        uses: actions/upload-artifact@v5
        with:
          name: tenant-${{ inputs.tenantKey }}-db-deploy-report
          path: tenant-${{ inputs.tenantKey }}-deploy-report.xml
          retention-days: 1
      - name: Remove temporary SQL firewall for GitHub runner
        if: always()
        continue-on-error: true
        shell: bash
        env:
          RG: rg-${{ env.PREFIX }}-${{ env.ENV_NAME }}-${{ env.TENANT_KEY }}
          SQL_SERVER: sql-${{ env.PREFIX }}-${{ env.ENV_NAME }}-${{ env.TENANT_KEY }}
        run: |
          RULE="${{ steps.sqlfw.outputs.rule }}"
          if [ -z "$RULE" ]; then exit 0; fi
          az sql server firewall-rule delete \
            --resource-group "$RG" \
            --server "$SQL_SERVER" \
            --name "$RULE"

