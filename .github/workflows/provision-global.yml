name: CD - Provision Global

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        default: prod
        type: choice
        options:
          - prod
          - uat
          - dev
          - qa
      confirm:
        description: Type DEPLOY to create/update Azure infrastructure
        required: true
        type: string
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      confirm:
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      SQL_ADMIN_LOGIN:
        required: true
      SQL_ADMIN_PASSWORD:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  resolve-profile:
    runs-on: ubuntu-latest
    outputs:
      staticWebSku: ${{ steps.resolve.outputs.staticWebSku }}
      apiPlanSku: ${{ steps.resolve.outputs.apiPlanSku }}
      sqlSku: ${{ steps.resolve.outputs.sqlSku }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve global stamp settings from manifests
        id: resolve
        shell: pwsh
        run: |
          $global = Get-Content -Raw chitstack.azure/deployment/global.json | ConvertFrom-Json
          $config = Get-Content -Raw chitstack.azure/deployment/tenants.json | ConvertFrom-Json
          if ($global.enabled -ne $true) { throw "Global stamp is disabled in chitstack.azure/deployment/global.json." }
          $envKey = "${{ inputs.environment }}"
          $ge = $global.environments.PSObject.Properties[$envKey].Value
          if (-not $ge -or $ge.enabled -ne $true) { throw "Environment '$envKey' is not enabled for global in global.json." }
          $profileName = [string]$global.profile
          $profile = $config.profiles.PSObject.Properties[$profileName].Value
          if (-not $profile) { throw "Profile '$profileName' not found in tenants.json." }
          $overrides = if (($global.PSObject.Properties.Name -contains 'overrides') -and $global.overrides) { $global.overrides } else { $null }
          $staticWebSku = if ($overrides -and $overrides.staticWebSku) { [string]$overrides.staticWebSku } else { [string]$profile.staticWebSku }
          $apiPlanSku = if ($overrides -and $overrides.apiPlanSku) { [string]$overrides.apiPlanSku } else { [string]$profile.apiPlanSku }
          $sqlSku = if ($overrides -and $overrides.sqlSku) { [string]$overrides.sqlSku } else { [string]$profile.sqlSku }
          "staticWebSku=$staticWebSku" >> $env:GITHUB_OUTPUT
          "apiPlanSku=$apiPlanSku" >> $env:GITHUB_OUTPUT
          "sqlSku=$sqlSku" >> $env:GITHUB_OUTPUT

  build:
    needs: resolve-profile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Restore and publish Global API
        shell: pwsh
        run: |
          dotnet restore chitstack.global/chitstack.global.api/ChitStack.Global.API.csproj
          dotnet publish chitstack.global/chitstack.global.api/ChitStack.Global.API.csproj -c Release -o artifacts/global-api
      - name: Build Global DACPAC
        shell: pwsh
        run: dotnet build chitstack.global/chitstack.global.database/ChitStack.Database.Global.sqlproj -c Release
      - name: Build Global web
        shell: pwsh
        env:
          VITE_API_BASE_URL: https://api-chitstack-${{ inputs.environment }}-global.azurewebsites.net/api
        run: |
          Push-Location chitstack.global/chitstack.global.web
          npm ci
          npm run build
          Pop-Location
      - name: Upload Global API artifact
        uses: actions/upload-artifact@v5
        with:
          name: global-api-package
          path: artifacts/global-api
      - name: Upload Global web artifact
        uses: actions/upload-artifact@v5
        with:
          name: global-web-dist
          path: chitstack.global/chitstack.global.web/dist
      - name: Upload Global DACPAC artifact
        uses: actions/upload-artifact@v5
        with:
          name: global-dacpac
          path: chitstack.global/chitstack.global.database/bin/Release/*.dacpac

  deploy-infra:
    needs: resolve-profile
    uses: ./.github/workflows/deploy-infra.yml
    with:
      confirm: ${{ inputs.confirm }}
      scope: global
      environment: ${{ inputs.environment }}
      tenantKey: global
      staticWebSku: ${{ needs.resolve-profile.outputs.staticWebSku }}
      apiPlanSku: ${{ needs.resolve-profile.outputs.apiPlanSku }}
      sqlSku: ${{ needs.resolve-profile.outputs.sqlSku }}
      resourceGroup: rg-chitstack-${{ inputs.environment }}-global
    secrets: inherit

  deploy-db-api-web:
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy-infra
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5
      - name: Download Global API artifact
        uses: actions/download-artifact@v5
        with:
          name: global-api-package
          path: artifacts/global-api
      - name: Download Global web artifact
        uses: actions/download-artifact@v5
        with:
          name: global-web-dist
          path: artifacts/global-web
      - name: Download Global DACPAC artifact
        uses: actions/download-artifact@v5
        with:
          name: global-dacpac
          path: artifacts/global-dacpac
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Open temporary SQL firewall for GitHub runner
        id: sqlfw
        shell: bash
        env:
          RG: rg-chitstack-${{ inputs.environment }}-global
          SQL_SERVER: sql-chitstack-${{ inputs.environment }}-global
        run: |
          set -e
          RUNNER_IP=$(curl -4sSf https://ipv4.icanhazip.com)
          echo "Runner egress IPv4: $RUNNER_IP"
          RULE="gh-${{ github.run_id }}-${{ github.run_attempt }}"
          az sql server firewall-rule create \
            --resource-group "$RG" \
            --server "$SQL_SERVER" \
            --name "$RULE" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP"
          echo "rule=$RULE" >> "$GITHUB_OUTPUT"
      - name: Install SqlPackage
        shell: bash
        run: dotnet tool update --global microsoft.sqlpackage
      - name: Generate Global DB deploy report
        shell: bash
        run: |
          ~/.dotnet/tools/sqlpackage \
            /Action:DeployReport \
            /SourceFile:artifacts/global-dacpac/ChitStack.Database.Global.dacpac \
            /TargetServerName:sql-chitstack-${{ inputs.environment }}-global.database.windows.net \
            /TargetDatabaseName:sqldb-chitstack-${{ inputs.environment }}-global \
            /TargetUser:${{ secrets.SQL_ADMIN_LOGIN }} \
            /TargetPassword:${{ secrets.SQL_ADMIN_PASSWORD }} \
            /OutputPath:global-deploy-report.xml
      - name: Publish Global DACPAC
        shell: bash
        run: |
          ~/.dotnet/tools/sqlpackage \
            /Action:Publish \
            /SourceFile:artifacts/global-dacpac/ChitStack.Database.Global.dacpac \
            /TargetServerName:sql-chitstack-${{ inputs.environment }}-global.database.windows.net \
            /TargetDatabaseName:sqldb-chitstack-${{ inputs.environment }}-global \
            /TargetUser:${{ secrets.SQL_ADMIN_LOGIN }} \
            /TargetPassword:${{ secrets.SQL_ADMIN_PASSWORD }} \
            /p:BlockOnPossibleDataLoss=true
      - name: Deploy Global API
        uses: azure/webapps-deploy@v3
        with:
          app-name: api-chitstack-${{ inputs.environment }}-global
          package: artifacts/global-api
      - name: Resolve App Insights connection string
        id: ai
        shell: bash
        env:
          RG: rg-chitstack-${{ inputs.environment }}-global
          ENV_NAME: ${{ inputs.environment }}
        run: |
          set +e
          AI=$(az monitor app-insights component show -g "$RG" --app "ai-chitstack-${ENV_NAME}-global" --query connectionString -o tsv)
          {
            echo "connection<<AIEOF"
            echo "$AI"
            echo "AIEOF"
          } >> "$GITHUB_OUTPUT"
      - name: Configure Global API app settings
        shell: pwsh
        env:
          RG: rg-chitstack-${{ inputs.environment }}-global
        run: |
          $ai = "${{ steps.ai.outputs.connection }}"
          ./chitstack.azure/deployment/scripts/configure-stamp-app.ps1 `
            -Scope global `
            -Environment "${{ inputs.environment }}" `
            -TenantKey global `
            -ResourceGroup $env:RG `
            -SqlLogin "${{ secrets.SQL_ADMIN_LOGIN }}" `
            -SqlPassword "${{ secrets.SQL_ADMIN_PASSWORD }}" `
            -AppInsightsConnectionString $ai
      - name: Deploy Global Web
        shell: bash
        env:
          RG: rg-chitstack-${{ inputs.environment }}-global
          SWA_NAME: web-chitstack-${{ inputs.environment }}-global
        run: |
          set -e
          TOKEN=$(az staticwebapp secrets list --resource-group "$RG" --name "$SWA_NAME" --query "properties.apiKey" -o tsv)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Could not read Static Web Apps deployment token (check name/RG and RBAC)."
            exit 1
          fi
          npx --yes @azure/static-web-apps-cli@2.0.8 deploy artifacts/global-web \
            --deployment-token "$TOKEN" \
            --env production
      - name: Upload DB deploy report
        uses: actions/upload-artifact@v5
        with:
          name: global-db-deploy-report
          path: global-deploy-report.xml
      - name: Remove temporary SQL firewall for GitHub runner
        if: always()
        continue-on-error: true
        shell: bash
        env:
          RG: rg-chitstack-${{ inputs.environment }}-global
          SQL_SERVER: sql-chitstack-${{ inputs.environment }}-global
        run: |
          RULE="${{ steps.sqlfw.outputs.rule }}"
          if [ -z "$RULE" ]; then exit 0; fi
          az sql server firewall-rule delete \
            --resource-group "$RG" \
            --server "$SQL_SERVER" \
            --name "$RULE"
