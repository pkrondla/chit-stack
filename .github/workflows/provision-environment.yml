name: Provision Environment

on:
  workflow_dispatch:
    inputs:
      scope:
        required: true
        default: global
        type: choice
        options:
          - global
          - tenant
      environment:
        required: true
        default: qa
        type: choice
        options:
          - dev
          - uat
          - qa
      tenantKey:
        required: false
        default: ""
      profile:
        required: true
        default: nonprod-ultra-low
        type: choice
        options:
          - nonprod-ultra-low
          - prod-min-safe
      confirm:
        description: Type DEPLOY to create/update Azure infrastructure
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          if [ "${{ inputs.scope }}" = "tenant" ] && [ -z "${{ inputs.tenantKey }}" ]; then
            echo "tenantKey is required when scope=tenant"
            exit 1
          fi

  provision-global:
    needs: validate
    if: ${{ inputs.scope == 'global' }}
    uses: ./.github/workflows/provision-global.yml
    with:
      environment: ${{ inputs.environment }}
      profile: ${{ inputs.profile }}
      confirm: ${{ inputs.confirm }}
    secrets: inherit

  provision-tenant:
    needs: validate
    if: ${{ inputs.scope == 'tenant' }}
    uses: ./.github/workflows/provision-tenant.yml
    with:
      tenantKey: ${{ inputs.tenantKey }}
      environment: ${{ inputs.environment }}
      profile: ${{ inputs.profile }}
      confirm: ${{ inputs.confirm }}
    secrets: inherit
