name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        shell: pwsh
        run: ./deployment/scripts/validate-config.ps1

  build-dotnet:
    runs-on: ubuntu-latest
    needs: validate-config
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore ChitStack.sln
      - name: Build
        run: dotnet build ChitStack.sln -c Release --no-restore
      - name: Test
        run: dotnet test ChitStack.sln -c Release --no-build --logger trx
      - name: Publish Global API
        run: dotnet publish ChitStack.Global.API/ChitStack.Global.API.csproj -c Release -o artifacts/global-api
      - name: Publish Tenant API
        run: dotnet publish ChitStack.API/ChitStack.API.csproj -c Release -o artifacts/tenant-api
      - name: Upload Global API artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-api-package
          path: artifacts/global-api
      - name: Upload Tenant API artifact
        uses: actions/upload-artifact@v4
        with:
          name: tenant-api-package
          path: artifacts/tenant-api

  build-global-web:
    runs-on: ubuntu-latest
    needs: validate-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
        working-directory: chitstack-global-web
      - name: Build
        run: npm run build
        working-directory: chitstack-global-web
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-web-dist
          path: chitstack-global-web/dist

  build-tenant-web:
    runs-on: ubuntu-latest
    needs: validate-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
        working-directory: chitstack-web
      - name: Build
        run: npm run build
        working-directory: chitstack-web
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tenant-web-dist
          path: chitstack-web/dist

  build-dacpac:
    runs-on: windows-latest
    needs: validate-config
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build Global DACPAC
        shell: pwsh
        run: msbuild ChitStack.Database.Global/ChitStack.Database.Global.sqlproj /p:Configuration=Release
      - name: Build Tenant DACPAC
        shell: pwsh
        run: msbuild ChitStack.Database.Tenant/ChitStack.Database.Tenant.sqlproj /p:Configuration=Release
      - name: Upload Global DACPAC artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-dacpac
          path: ChitStack.Database.Global/bin/Release/*.dacpac
      - name: Upload Tenant DACPAC artifact
        uses: actions/upload-artifact@v4
        with:
          name: tenant-dacpac
          path: ChitStack.Database.Tenant/bin/Release/*.dacpac
