name: CI - Build & Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      global: ${{ steps.filter.outputs.global }}
      tenant: ${{ steps.filter.outputs.tenant }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            global:
              - 'chitstack.global/chitstack.global.api/**'
              - 'chitstack.global/chitstack.global.application/**'
              - 'chitstack.global/chitstack.global.infrastructure/**'
              - 'chitstack.global/chitstack.global.domain/**'
            tenant:
              - 'chitstack.tenant/chitstack.tenant.api/**'
              - 'chitstack.tenant/chitstack.tenant.application/**'
              - 'chitstack.tenant/chitstack.tenant.infrastructure/**'
              - 'chitstack.tenant/chitstack.tenant.domain/**'

  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate deployment configuration
        shell: pwsh
        run: ./chitstack.azure/deployment/scripts/validate-config.ps1

  build-dotnet:
    runs-on: ubuntu-latest
    needs: [validate-config, changes]
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore ChitStack.sln
      - name: Build
        run: dotnet build ChitStack.sln -c Release --no-restore
      - name: Test
        run: dotnet test ChitStack.sln -c Release --no-build --logger trx
      - name: Publish Global API
        run: dotnet publish chitstack.global/chitstack.global.api/ChitStack.Global.API.csproj -c Release -o artifacts/global-api
      - name: Publish Tenant API
        run: dotnet publish chitstack.tenant/chitstack.tenant.api/ChitStack.API.csproj -c Release -o artifacts/tenant-api
      - name: Upload Global API artifact
        uses: actions/upload-artifact@v5
        with:
          name: global-api-package
          path: artifacts/global-api
          retention-days: 1
      - name: Upload Tenant API artifact
        uses: actions/upload-artifact@v5
        with:
          name: tenant-api-package
          path: artifacts/tenant-api
          retention-days: 1

  build-global-slice:
    runs-on: ubuntu-latest
    needs: [validate-config, changes]
    if: ${{ needs.changes.outputs.global == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Build global API path
        run: dotnet build chitstack.global/chitstack.global.api/ChitStack.Global.API.csproj -c Release

  build-tenant-slice:
    runs-on: ubuntu-latest
    needs: [validate-config, changes]
    if: ${{ needs.changes.outputs.tenant == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Build tenant API path
        run: dotnet build chitstack.tenant/chitstack.tenant.api/ChitStack.API.csproj -c Release

  build-global-web:
    runs-on: ubuntu-latest
    needs: validate-config
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
        working-directory: chitstack.global/chitstack.global.web
      - name: Build
        run: npm run build
        working-directory: chitstack.global/chitstack.global.web
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: global-web-dist
          path: chitstack.global/chitstack.global.web/dist
          retention-days: 1

  build-tenant-web:
    runs-on: ubuntu-latest
    needs: validate-config
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
        working-directory: chitstack.tenant/chitstack.tenant.web
      - name: Build
        run: npm run build
        working-directory: chitstack.tenant/chitstack.tenant.web
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: tenant-web-dist
          path: chitstack.tenant/chitstack.tenant.web/dist
          retention-days: 1

  build-dacpac:
    runs-on: ubuntu-latest
    needs: validate-config
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Build Global DACPAC
        run: dotnet build chitstack.global/chitstack.global.database/ChitStack.Database.Global.sqlproj -c Release
      - name: Build Tenant DACPAC
        run: dotnet build chitstack.tenant/chitstack.tenant.database/ChitStack.Database.Tenant.sqlproj -c Release
      - name: Upload Global DACPAC artifact
        uses: actions/upload-artifact@v5
        with:
          name: global-dacpac
          path: chitstack.global/chitstack.global.database/bin/Release/*.dacpac
          retention-days: 1
      - name: Upload Tenant DACPAC artifact
        uses: actions/upload-artifact@v5
        with:
          name: tenant-dacpac
          path: chitstack.tenant/chitstack.tenant.database/bin/Release/*.dacpac
          retention-days: 1
