name: Internal - Deploy Infrastructure

on:
  workflow_call:
    inputs:
      confirm:
        description: Must be exactly DEPLOY to create/update Azure resources
        required: true
        type: string
      scope:
        required: true
        type: string
      environment:
        required: true
        type: string
      tenantKey:
        required: false
        type: string
        default: global
      staticWebSku:
        required: true
        type: string
      apiPlanSku:
        required: true
        type: string
      sqlSku:
        required: true
        type: string
      resourceGroup:
        required: true
        type: string
      location:
        required: false
        type: string
        default: centralindia
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      SQL_ADMIN_LOGIN:
        required: true
      SQL_ADMIN_PASSWORD:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Confirm infrastructure deployment
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DEPLOY" ]; then
            echo "Refusing infra deploy: set confirm to exactly DEPLOY (got: '$CONFIRM')."
            exit 1
          fi
      - uses: actions/checkout@v5
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Bicep
        shell: bash
        run: |
          az group create --name "${{ inputs.resourceGroup }}" --location "${{ inputs.location }}"
          az deployment group create \
            --resource-group "${{ inputs.resourceGroup }}" \
            --template-file chitstack.azure.iac/main.bicep \
            --parameters \
              scope="${{ inputs.scope }}" \
              environment="${{ inputs.environment }}" \
              tenantKey="${{ inputs.tenantKey }}" \
              location="${{ inputs.location }}" \
              staticWebSku="${{ inputs.staticWebSku }}" \
              apiPlanSku="${{ inputs.apiPlanSku }}" \
              sqlSku="${{ inputs.sqlSku }}" \
              sqlAdminLogin="${{ secrets.SQL_ADMIN_LOGIN }}" \
              sqlAdminPassword="${{ secrets.SQL_ADMIN_PASSWORD }}"
